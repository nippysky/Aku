# Akù API — nginx server block
# Place this file at /etc/nginx/sites-available/aku
# Then: sudo ln -s /etc/nginx/sites-available/aku /etc/nginx/sites-enabled/aku
# And : sudo nginx -t && sudo systemctl reload nginx

server {
    server_name aku.nippysky.com;

    # ── Proxy all /api/* traffic to the Node server ──
    location /api/ {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Keep-alive
        proxy_set_header   Connection        "";

        # Timeouts
        proxy_connect_timeout 10s;
        proxy_read_timeout    30s;
    }

    # ── Health check (no auth needed) ──
    location /health {
        proxy_pass http://127.0.0.1:3000/health;
        proxy_set_header Host $host;
    }

    # ── Akù static website (landing + legal pages) ──
    # Clean URLs: /privacy → privacy.html, /terms → terms.html,
    #             /delete-account → delete-account.html
    # Store-listing URLs (Apple + Google):
    #   Privacy policy:   https://aku.nippysky.com/privacy
    #   Account deletion: https://aku.nippysky.com/delete-account
    location / {
        root /var/www/aku-api/public;
        index index.html;
        try_files $uri $uri.html $uri/ =404;
        add_header Cache-Control "public, max-age=3600";
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/aku.nippysky.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/aku.nippysky.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}

# ── HTTPS (add after you run: sudo certbot --nginx -d ops.panth.art) ──
# Certbot will automatically append the SSL server block below.
# Run: sudo apt install certbot python3-certbot-nginx -y
#      sudo certbot --nginx -d ops.panth.art


server {
    if ($host = aku.nippysky.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name aku.nippysky.com;
    return 404; # managed by Certbot


}