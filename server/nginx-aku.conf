# Akù API — nginx server block
# Place this file at /etc/nginx/sites-available/aku
# Then: sudo ln -s /etc/nginx/sites-available/aku /etc/nginx/sites-enabled/aku
# And : sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    server_name aku.nippysky.com;

    # ── Proxy all /api/* traffic to the Node server ──
    location /api/ {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Keep-alive
        proxy_set_header   Connection        "";

        # Timeouts
        proxy_connect_timeout 10s;
        proxy_read_timeout    30s;
    }

    # ── Health check (no auth needed) ──
    location /health {
        proxy_pass http://127.0.0.1:3000/health;
        proxy_set_header Host $host;
    }

    # ── Everything else → 404 ──
    location / {
        return 404;
    }
}

# ── HTTPS (add after you run: sudo certbot --nginx -d ops.panth.art) ──
# Certbot will automatically append the SSL server block below.
# Run: sudo apt install certbot python3-certbot-nginx -y
#      sudo certbot --nginx -d ops.panth.art
